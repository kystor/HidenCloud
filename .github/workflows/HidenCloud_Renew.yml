name: HidenCloud 核心续期逻辑

on:
  workflow_dispatch:  # 允许在网页上手动点击触发测试
  schedule:
    - cron: '0 0 1 * *'   # 初始定时设定，随后会被脚本根据到期时间自动修改

permissions:
  contents: write    # 【重要】允许脚本向仓库写入修改后的 YAML 文件
  actions: write

jobs:
  renew-job:
    runs-on: ubuntu-latest
    steps:
      - name: 步骤 1：拉取仓库代码
        uses: actions/checkout@v4

      - name: 步骤 2：设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 步骤 3：安装必要的依赖包
        run: pip install --quiet seleniumbase

      - name: 步骤 4：运行多账号续期 Python 脚本
        env:
          # 从 Secrets 获取环境变量，格式为：账号1:密码1,账号2:密码2
          HIDENCLOUD: ${{ secrets.HIDENCLOUD }}
        # 使用 -u 强制无缓冲输出以实时看日志，同时把日志存入 renew.log
        run: python3 -u main.py 2>&1 | tee renew.log

      - name: 步骤 5：提取时间并计算下一次 Cron (提前 24 小时)
        run: |
          # 1. 抓取最早的到期时间
          DUE_DATE=$(grep -oP '到期时间\(标准\): \K\d{4}-\d{2}-\d{2}' renew.log | tail -1 || echo "")
          
          if [ -z "$DUE_DATE" ]; then
            echo "⚠️ 未能提取到期时间，跳过 Cron 更新。"
            exit 0
          fi
          
          echo "📅 检测到所有账号中最先到期的日期为: $DUE_DATE"

          # 2. 转换为时间戳计算剩余小时数
          CURRENT_EPOCH=$(date -u +%s)
          DUE_EPOCH=$(date -u -d "$DUE_DATE 00:00:00" +%s)
          
          REMAINING_SECONDS=$((DUE_EPOCH - CURRENT_EPOCH))
          REMAINING_HOURS=$((REMAINING_SECONDS / 3600))
          
          echo "⏳ 距离最早到期还有 $REMAINING_HOURS 小时"

          # 3. 提前 24 小时唤醒
          if [ "$REMAINING_HOURS" -gt 24 ]; then
            HOURS_UNTIL_NEXT_RUN=$((REMAINING_HOURS - 24))
          else
            # 如果快过期了或者异常，默认 4 小时后重试
            HOURS_UNTIL_NEXT_RUN=4
          fi

          # 4. 生成目标时间的 Cron 表达式
          NEXT_MINUTE=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-M")
          NEXT_HOUR=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-H")
          NEXT_DAY=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-d")
          NEXT_MONTH=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-m")

          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"
          echo "⏰ 计划下一次运行的 Cron 为: $NEW_CRON"

          # 5. 替换当前文件中的 Cron 行
          WORKFLOW_FILE=".github/workflows/renew.yml"
          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          
          if [ -z "$LINE_NUM" ]; then
            echo "❌ 找不到 cron 配置行，更新失败！"
            exit 1
          fi

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'   # 自动更新下次运行时间" "$WORKFLOW_FILE"

          # 6. 将修改提交到仓库
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          
          if ! git diff --staged --quiet; then
            git commit -m "🔄 自动更新续期 Cron 表达式为 $NEW_CRON (提前24小时)"
            git push
            echo "✅ Cron 已成功更新到仓库！下次将会自动运行。"
          else
            echo "ℹ️ 时间没有变化，无需更新。"
          fi

      - name: 步骤 6：打包输出所有的截图和日志
        if: always()   # 【核心指令】不管上面的代码有没有报错，必须执行截图打包
        uses: actions/upload-artifact@v4
        with:
          name: 运行截图与日志-${{ github.run_id }}
          path: |
            screenshots/*.png
            renew.log
          retention-days: 7   # 文件保存 7 天
