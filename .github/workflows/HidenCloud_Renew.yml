name: HidenCloud 核心自动续期

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write      # 允许 git push
  actions: write       # 如果以后要用到 actions 相关 API

jobs:
  renew-job:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet seleniumbase playwright-stealth

      - name: 运行续期脚本
        env:
          TEST_ACCOUNTS: ${{ secrets.HIDENCLOUD }}
        run: python3 -u main.py 2>&1 | tee renew.log

      # ----- 新增步骤：从日志中提取 NEXT_CRON 并更新 workflow -----
      - name: 更新工作流定时 cron 并推送
        if: always()    # 即使续期步骤失败也尝试更新（确保时间能修正）
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          # 1. 提取 Python 输出的 NEXT_CRON 值
          NEXT_CRON=$(grep -oP 'NEXT_CRON=\K.*' renew.log || echo "0 0 * * *")
          echo ">> 提取到新 cron: $NEXT_CRON"

          # 2. 修改 workflow 文件中的 cron 字段
          sed -i "s|cron: '.*'|cron: '$NEXT_CRON'|" .github/workflows/HidenCloud_Renew.yml

          # 3. 配置 git 身份（避免未知作者）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. 设置带 token 的远程推送地址
          git remote set-url origin https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # 5. 提交并推送
          git add .github/workflows/HidenCloud_Renew.yml
          git commit -m "🔄 自动更新下次调度 cron 为 $NEXT_CRON [skip ci]" || echo "没有变更，跳过提交"
          git push origin HEAD:main || echo "❌ 推送失败，请检查 REPO_TOKEN 权限"

      - name: 保存截图和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 运行截图与日志-${{ github.run_id }}
          path: |
            screenshots/*.png
            renew.log
          retention-days: 7
